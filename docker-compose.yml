version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "user:password@tcp(db:3306)/mydb?parseTime=true"
    depends_on:
      db:
        condition: service_healthy   # DBが起動してからappを起動
    tty: true         
    stdin_open: true
    command: sleep infinity
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql        # データ永続化
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # 初期化SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8081:8080"

volumes:
  db_data: